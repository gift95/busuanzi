Web:
  Address: 0.0.0.0:8080 # 监听地址
  Cors: "*" # 跨域访问
  Debug: false # 是否开启debug模式
  Log: false # 是否开启日志
  RateLimit: 10      # 每 IP 每秒请求数（令牌桶），0 关闭
  RateLimitBurst: 20 # 令牌桶容量（突发上限）
Redis:
  Address: redis:6379 # redis地址
  Password: 
  Database: 0
  TLS: false      # 是否使用TLS连接redis
  Prefix: bsz     # redis前缀
  MaxIdle: 25     # 最大空闲连接数
  MaxActive: 100  # 最大连接数
  MinIdle: 25     # 最小空闲连接数
  MaxRetries: 3   # 最大重试次数
Bsz:
  Expire: 0        # 统计数据过期时间 单位秒, 请输入整数 (无任何访问, 超过这个时间后, 统计数据将被清空, 0为不过期)
  Secret: "bsz"    # 必须替换为 ≥16 位随机值，否则服务拒绝启动（可用环境变量 BSZ_SECRET 覆盖）
  Encrypt: "" # 加密算法 (MD516 / MD532/空)
  Privacy: true  # 隐私模式（默认开启，同上游）：host/path 一律 MD5 混淆、身份取 MD5(IP+UA)；设为 false 则使用明文 host/path + 明文 IP
  PathStyle: true  # 路径样式 (false: url&path, true: path) 老版本请使用 false,  true 更便于数据迁移
  AllowHosts: ""   # 允许统计的域名白名单（逗号分隔，如 a.com,b.com），空则不限制


# TIPS, 所有 config 内的设置, 均可使用 环境变量 覆盖
# Ex BSZ_SECRET=123 将覆盖 config.yaml 中的 Bsz.Secret