version: "3.8"

services:
  redis:
    image: "redis:alpine"
    volumes:
      - ./data/redis:/data
  
  bsz:
    image: "gift95/busuanzi:latest"
    ports:
      - "8080:8080"                            # 修改映射到宿主机的端口 host:container
    volumes:
       - ./data/bsz:/app/expose
    links:
      - redis
    depends_on:
      - redis
    environment:
      WEB_LOG: true                             # 是否开启日志
      WEB_DEBUG: false                          # 是否开启debug模式
      WEB_CORS: "*"                             # 跨域访问
      WEB_RATELIMIT: 10                         # 每 IP 每秒请求数（令牌桶），0 关闭
      WEB_RATELIMITBURST: 20                    # 令牌桶容量（突发上限）
      BSZ_EXPIRE: 0                             # 统计数据过期时间 单位秒, 请输入整数 (无任何访问, 超过这个时间后, 统计数据将被清空, 0为不过期)
      BSZ_SECRET: "REPLACE_WITH_RANDOM_SECRET"  # 必填：≥16 位随机密钥，如 openssl rand -hex 16 生成
      API_SERVER: http:\/\/127.0.0.1:8080       # 填写你的 API 地址 需要转译 (即 用 `\/` 替代 `/`)
      REDIS_ADDRESS: redis:6379                 # redis 地址
      REDIS_PASSWORD: 
      BSZ_PATHSTYLE: true                       # 路径样式 (false: url&path, true: path) 老版本请使用 false, true 更便于数据迁移
      BSZ_ENCRYPT:                              # 加密算法 (MD516 / MD532/空)
      BSZ_PRIVACY: "true"                       # 隐私模式（默认开启，同上游）：host/path 一律 MD5 混淆、身份取 MD5(IP+UA)；false 则明文 host/path + 明文 IP
      BSZ_ALLOWHOSTS: ""                        # 允许统计的域名白名单（逗号分隔，如 a.com,b.com），空则不限制